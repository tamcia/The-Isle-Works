  <div id="loading" class="fixed inset-0 flex items-center justify-center bg-offwhite z-40 animate-pulse-slow font-sans uppercase tracking-widest text-sm text-charcoal">
    Loading The Element...
  </div>

  <!-- Viewer -->
  <main class="flex-grow w-full h-[calc(100vh-73px)] relative">
    <model-viewer
      src="models/The_Element.glb"
      ios-src="models/The_Element.usdz"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      class="w-full h-full">
    </model-viewer>

    <!-- AR Button matching the index page buttons exactly -->
    <button id="ar-button" class="fixed bottom-6 right-6 px-4 py-3 bg-lilacgrey hover:bg-brandlavender text-charcoal hover:text-snowwhite rounded-lg text-xs uppercase tracking-widest font-sans font-light transition-all duration-300 z-[100]">
      View in AR
    </button>
  </main>

  <script>
    const viewer = document.querySelector("model-viewer");
    const loader = document.getElementById("loading");
    const arButton = document.getElementById("ar-button");

    viewer.addEventListener("load", () => {
      loader.style.display = "none";
    });

    // Trigger AR manually when the external button is clicked
    arButton.addEventListener("click", () => {
      viewer.activateAR();
    });
  </script>
