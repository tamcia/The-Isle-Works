
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>

<style>
body {
  margin: 0;
  font-family: "fonts/Barlow-Regular.ttf", sans-serif;
}

/* NAVBAR */
.navbar {
  background: #d5d2df;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.home-icon {
  color: white;
  font-size: 22px;
  text-decoration: none;
   font-family: "Segoe UI Symbol", "Arial Unicode MS", sans-serif;
}

/* Loading text */
#loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 18px;
  opacity: 0.8;
  color: rgb(0, 0, 0);
  text-align: center;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

/* Viewer */
model-viewer {
  width: 100vw;
  height: calc(100vh - 60px); /* subtract navbar height */
}


model-viewer::part(default-progress-bar) {
  display: none;
}

/* AR Button (styled like homepage button) */
.ar-button {
  position: absolute;
  bottom: 20px;
  right: 20px;

  padding: 10px 14px;

  background: #bcb3cb;
  color: white;

  border: none;
  border-radius: 8px;

  font-size: 14px;
  font-family: "fonts/Barlow-Regular.ttf", sans-serif;

  cursor: pointer;
  transition: 0.3s;
}

/* Hover */
.ar-button:hover {
  background: #a89eb6;
  transform: translateY(-2px);
}

/* Hide AR button on desktop (shows only on touch/mobile devices) */
@media (hover: hover) and (pointer: fine) {
  .ar-button {
    display: none !important;
  }
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-left">
    <a class="home-icon" href="https://tamcia.github.io/The-Isle-Works/">ꕤ</a>
  </div>
</div>

<div id="loading">Loading The Isle 03...</div>

<model-viewer
  src="models/The_Isle_03.glb"
  ios-src="models/The_Isle_03.usdz"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate>

  <!-- AR button -->
  <button slot="ar-button" class="ar-button">
    <strong>View in AR</strong>
  </button>

</model-viewer>

<script>
const viewer = document.querySelector("model-viewer");

viewer.addEventListener("load", () => {
  document.getElementById("loading").style.display = "none";
});
</script>

</body>
</html>
