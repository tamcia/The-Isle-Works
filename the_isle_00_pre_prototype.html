
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Isle Works — Model Viewer</title>

  <!-- Google Fonts: Consistent with Portfolio -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400&family=Scope+One&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Model Viewer Module -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            offwhite: '#F4F3EF',
            snowwhite: '#FAFAFA',
            charcoal: '#2A2A2A',
            taupe: '#CFCAC2',
            lilacgrey: '#D6D0E6',
            brandlavender: '#A49CBA',
          },
          fontFamily: {
            headline: ['"Scope One"', 'serif'],
            sans: ['"Josefin Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F4F3EF;
      color: #2A2A2A;
      font-family: 'Josefin Sans', sans-serif;
      overflow: hidden; /* Prevent scrolling inside viewer */
    }

    model-viewer::part(default-progress-bar) {
      display: none;
    }
    
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .animate-pulse-slow {
      animation: pulse 1.5s infinite;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">

  <!-- Navigation bar (Matches Portfolio) -->
  <nav class="bg-snowwhite border-b border-taupe/30 px-6 py-4 md:px-12 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a class="flex items-center gap-3 group focus:outline-none" href="https://tamcia.github.io/The-Isle-Works/">
        <svg class="w-8 h-8 text-charcoal group-hover:text-brandlavender transition-colors duration-300 transform group-hover:rotate-6" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M50,15 C60,15 72,25 72,40 C72,55 58,58 50,58 C42,58 28,55 28,40 C28,25 40,15 50,15 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M50,85 C60,85 78,75 78,60 C78,45 58,45 50,45 C42,45 22,45 22,60 C22,75 40,85 50,85 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M50,15 L50,85" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,2"/>
          <circle cx="50" cy="50" r="3" fill="currentColor"/>
        </svg>
        <span class="font-headline tracking-widest text-sm uppercase opacity-90 group-hover:opacity-100 group-hover:text-brandlavender transition-all duration-300">
          The Isle Works
        </span>
      </a>
    </div>
  </nav>

  <!-- Loading State -->
  <div id="loading" class="fixed inset-0 flex items-center justify-center bg-offwhite z-40 animate-pulse-slow font-sans uppercase tracking-widest text-sm text-charcoal">
    Loading Pre Prototype...
  </div>

  <!-- Viewer -->
  <main class="flex-grow w-full h-[calc(100vh-73px)] relative">
    <model-viewer
      src="models/The_Isle_00_pre_prototype.glb"
      ios-src="models/The_Isle_00_pre_prototype.usdz"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      class="w-full h-full">
    </model-viewer>

    <!-- AR Button placed outside for fixed positioning -->
   <button id="ar-button" class="fixed bottom-6 right-6 px-6 py-3 bg-lilacgrey hover:bg-brandlavender text-charcoal hover:text-snowwhite rounded-lg text-xs uppercase tracking-widest font-sans font-light transition-all duration-300 shadow-sm border border-taupe/20 z-[100]">
  View in AR
</button>
  </main>

  <style>
    /* Show button only on touch devices */
    @media (pointer: coarse) {
      #ar-button { display: block !important; }
    }
  </style>

  <script>
    const viewer = document.querySelector("model-viewer");
    const loader = document.getElementById("loading");
    const arButton = document.getElementById("ar-button");

    viewer.addEventListener("load", () => {
      loader.style.display = "none";
    });

    // Trigger AR manually when the external button is clicked
    arButton.addEventListener("click", () => {
      viewer.activateAR();
    });
  </script>
</body>
</html>
